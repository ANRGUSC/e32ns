# Two mock nodes over a constant 10 % loss link: node 1 unicasts to node 2 every 10 ms, and
# lost attempts are retried. Runs anywhere, no QEMU needed.
name: two_node_controlled_link

nodes:
  - { id: 1, mac: "aa:bb:cc:00:00:01", pos: [0, 0] }
  - { id: 2, mac: "aa:bb:cc:00:00:02", pos: [5, 0] }

medium:
  error_model: constant
  packet_error_rate: 0.1

run:
  duration_us: 100000
  slice_us: 1000
  seed: 1

traffic:
  - { node: 1, dst: "aa:bb:cc:00:00:02", at_us: 5000, size_bytes: 32, count: 10, period_us: 10000 }
