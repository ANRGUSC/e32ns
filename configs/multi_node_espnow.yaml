# M3 — multi-node ESP-NOW with the physical SNR->PER medium (brief §9).
# A line of 5 nodes 20 m apart; node 1 broadcasts, delivery degrades with distance.
name: multi_node_espnow

nodes:
  - { id: 1, mac: "aa:bb:cc:00:00:01", pos: [0,   0], channel: 6 }
  - { id: 2, mac: "aa:bb:cc:00:00:02", pos: [20,  0], channel: 6 }
  - { id: 3, mac: "aa:bb:cc:00:00:03", pos: [40,  0], channel: 6 }
  - { id: 4, mac: "aa:bb:cc:00:00:04", pos: [60,  0], channel: 6 }
  - { id: 5, mac: "aa:bb:cc:00:00:05", pos: [80,  0], channel: 6 }

medium:
  error_model: snr_per        # physical model (D-007)
  path_loss_exponent: 3.0     # ns-3 default (brief §5)
  tx_power_dbm: 20.0
  noise_figure_db: 7.0
  capture_threshold_db: 4.0
  max_retries: 3

run:
  duration_us: 200000
  slice_us: 1000
  seed: 7

# Node 1 broadcasts a beacon every 20 ms; delivery to nodes 2..5 should degrade
# with distance under the snr_per model.
traffic:
  - node: 1
    dst: broadcast
    at_us: 5000
    size_bytes: 50
    count: 8
    period_us: 20000
