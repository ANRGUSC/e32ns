# Five mock nodes 20 m apart under the physical SNR->PER model: node 1 broadcasts a beacon every
# 20 ms. All four receivers sit well inside the ~200 m range (V-001), so every beacon arrives;
# each receiver's RSSI falls with distance. Runs anywhere, no QEMU needed.
name: multi_node_espnow

nodes:
  - { id: 1, mac: "aa:bb:cc:00:00:01", pos: [0, 0], channel: 6 }
  - { id: 2, mac: "aa:bb:cc:00:00:02", pos: [20, 0], channel: 6 }
  - { id: 3, mac: "aa:bb:cc:00:00:03", pos: [40, 0], channel: 6 }
  - { id: 4, mac: "aa:bb:cc:00:00:04", pos: [60, 0], channel: 6 }
  - { id: 5, mac: "aa:bb:cc:00:00:05", pos: [80, 0], channel: 6 }

run:
  duration_us: 200000
  slice_us: 1000
  seed: 7

traffic:
  - { node: 1, dst: broadcast, at_us: 5000, size_bytes: 50, count: 8, period_us: 20000 }
