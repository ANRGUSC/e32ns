# M2: two real ESP32-S3 firmware nodes over a controlled 20 %-loss link.
# Node 1 runs firmware A (broadcast pings), node 2 firmware B (unicast replies with retries).
# Expected: ~80 % of pings arrive; nearly every reply is ACKed (1 - 0.2^4).
name: m2_two_qemu

nodes:
  - { id: 1, mac: "aa:bb:cc:00:00:01", pos: [0, 0], firmware: ../firmware/examples/espnow_ping/build }
  - { id: 2, mac: "aa:bb:cc:00:00:02", pos: [5, 0], firmware: ../firmware/examples/espnow_pong/build }

medium:
  error_model: constant
  packet_error_rate: 0.2

run:
  duration_us: 6000000
  slice_us: 250
  seed: 1
