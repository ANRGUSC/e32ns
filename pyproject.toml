[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-netsim"
version = "0.1.0"
description = "A Cooja-like network emulator for ESP32-S3: virtual QEMU nodes over a custom wireless-link medium (Wi-Fi + ESP-NOW)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ANRG" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Espressif's own NVS writer: gives each QEMU node its identity without hand-encoding NVS pages.
qemu = ["esp-idf-nvs-partition-gen>=0.1"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
esp-netsim = "esp_netsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esp_netsim = ["trace/report.html", "editor.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
